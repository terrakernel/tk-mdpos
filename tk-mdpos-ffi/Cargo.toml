[package]
name = "tk-mdpos-ffi"
description = "C ABI for mdpos. Template string in, ESC/POS bytes out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tk_mdpos"
# cdylib for hosts that dlopen or link dynamically (JNI, .NET, Node, Python ctypes);
# staticlib for iOS and for anyone who wants one artifact with no runtime lookup.
#
# No `rlib`: this lib is deliberately named `tk_mdpos` so the artifact is `libtk_mdpos.so`
# / `.dylib` / `.a`, matching the `tk_mdpos_*` symbols it exports. An rlib under that name
# is ambiguous with the core crate's own; Rust callers depend on `tk-mdpos` directly.
crate-type = ["cdylib", "staticlib"]

[dependencies]
tk-mdpos.workspace = true
