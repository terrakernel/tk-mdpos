[package]
name = "tk-mdpos-cli"
description = "Command-line renderer for mdpos templates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# All file and stream I/O lives here, never in the core crate.
[dependencies]
tk-mdpos.workspace = true

# The crate is `tk-mdpos-cli` so it is unambiguous on a shared registry; the command it
# installs is `mdpos`, because a name on your own PATH has no such ambiguity to resolve.
[[bin]]
name = "mdpos"
path = "src/main.rs"
